# ─── Render Blueprint ───────────────────────────────────────────
# Infrastructure-as-code for Render.com
#
# Services:
#   - web:      Next.js Docker app (health-checked, auto-deployed)
#   - postgres: Managed PostgreSQL (free tier, 1GB, auto-expires 90 days)
#
# Note: Render free tier does not include managed Redis.
# Rate limiting will fail-open (gracefully degrade) without Redis.
# To add Redis later: define `type: redis` on a paid plan.

services:
  # ─── Web Service ──────────────────────────────────────────
  - type: web
    name: workmanager
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free

    # Render polls this endpoint to determine service health
    healthCheckPath: /api/health

    # Run database migrations + idempotent seed before deploying the new version.
    # packages/database (with pinned drizzle-kit/tsx/drizzle-orm/postgres/zod) is
    # baked into the Docker image by the runner stage, so `npx` resolves locally.
    preDeployCommand: cd packages/database && npx drizzle-kit migrate && npx tsx src/seed.ts

    # Auto-deploy from main branch
    branch: main
    pullRequestPreview:
      enabled: false

    envVars:
      # ── Application ──
      - key: NODE_ENV
        value: production
      # NEXT_PUBLIC_APP_URL / AUTH_URL default to the *.onrender.com URL.
      # Once DNS points app.workmanager.com at this service, override BOTH in
      # the Render dashboard to https://app.workmanager.com so email links,
      # auth trust, and CSRF origin checks use the real custom domain.
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: workmanager
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_URL
        fromService:
          type: web
          name: workmanager
          envVarKey: RENDER_EXTERNAL_URL

      # Build arg: baked into the client bundle at build time (Dockerfile
      # ARG NEXT_PUBLIC_APP_URL) — runtime env vars don't reach the client.
      # Render passes any BUILDARG_* var as a Docker build arg. After DNS,
      # override this too (alongside NEXT_PUBLIC_APP_URL) with
      # https://app.workmanager.com and redeploy.
      - key: BUILDARG_NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: workmanager
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: 3000

      # ── Database (auto-injected from managed Postgres) ──
      - key: DATABASE_URL
        fromDatabase:
          name: workmanager-db
          property: connectionString

      # ── Auth ──
      # Generate with: openssl rand -base64 32
      - key: AUTH_SECRET
        sync: false

      # ── Secret encryption (Slack webhook secrets etc.) ──
      # AES-256-GCM key derivation input; REQUIRED in production or
      # lib/encryption.ts throws. Generate with: openssl rand -base64 32
      - key: ENCRYPTION_KEY
        sync: false

      # ── Cron automation (overdue checks, EOD snapshots) ──
      # Bearer token for /api/automation/check-overdue and
      # /api/cron/generate-eod-snapshot. Generate with: openssl rand -hex 32
      - key: CRON_SECRET
        sync: false

      # ── Storage (S3-compatible) ──
      # Set these manually in the Render dashboard if using file uploads
      - key: S3_ENDPOINT
        value: ""
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: workmanagement-files

      # ── Search (Meilisearch) ──
      # Set if you have a Meilisearch instance
      - key: MEILISEARCH_HOST
        value: ""
      - key: MEILISEARCH_API_KEY
        sync: false

      # ── Email (Resend) ──
      # Set RESEND_API_KEY in the Render dashboard (sync: false so it stays
      # out of the blueprint). Verify the sending domain (SPF + DKIM) at
      # https://resend.com/domains before relying on it in production.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@workmanager.com
      - key: EMAIL_FROM_NAME
        value: WorkManager
      - key: EMAIL_UNSUBSCRIBE_URL
        value: https://app.workmanager.com/settings/notifications

# ─── Managed PostgreSQL ─────────────────────────────────────
databases:
  - name: workmanager-db
    plan: free
    databaseName: workmanager
    databaseUser: wmuser
    # Free tier caveats: no automated backups, auto-deletes after 90 days
    # (set a calendar reminder to export via `pg_dump` and/or upgrade), and
    # the free web service sleeps after ~15 min of inactivity (cold start
    # on wake). Upgrade to Starter before relying on it for real users.
